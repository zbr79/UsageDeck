name: Release

# Publishes release v<version> when root Cargo.toml reaches main with a workspace version
# that has no complete release yet. Both users and the in-app updater download
# https://github.com/zbr79/UsageDeck/releases/latest/download/UsageDeck-Setup.exe,
# so that asset name must never change.
#
# UsageDeck-Setup.exe is the pure-Rust per-user installer (crates/usagedeck-installer)
# with release usagedeck.exe embedded inside; it supports /S, /P /UPDATE, /S /UPDATE
# (compatible with v1.x and v2.x updaters), and /UNINSTALL [/S].
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish UsageDeck release
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read workspace version and check existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk '{ sub(/\r$/, "") }
            /^[[:space:]]*\[workspace\.package\][[:space:]]*$/ { in_sec=1; next }
            /^[[:space:]]*\[/ { in_sec=0 }
            in_sec && /^[[:space:]]*version[[:space:]]*=/ {
              sub(/^[^"]*"/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Failed to read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A release that exists without UsageDeck-Setup.exe is repaired by uploading assets below.
          if gh release view "$tag" --json assets --jq '.assets[].name' 2> /dev/null | grep -qx 'UsageDeck-Setup.exe'; then
            echo "$tag already has UsageDeck-Setup.exe; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $tag."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - if: steps.version.outputs.publish == 'true'
        name: Build release usagedeck.exe
        run: |
          cargo build --release --bin usagedeck
          test -f target/release/usagedeck.exe

      - if: steps.version.outputs.publish == 'true'
        name: Build release UsageDeck-Setup.exe and stage assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          USAGEDECK_EXE_PATH="$(cygpath -w "$PWD/target/release/usagedeck.exe")" \
            cargo build --release --bin UsageDeck-Setup
          test -f target/release/UsageDeck-Setup.exe
          mkdir -p dist-release
          cp target/release/UsageDeck-Setup.exe dist-release/UsageDeck-Setup.exe
          cp target/release/usagedeck.exe "dist-release/usagedeck-v${VERSION}-x64.exe"
          ls -lh dist-release/

      - if: steps.version.outputs.publish == 'true'
        name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* \
              --target "$GITHUB_SHA" \
              --title "UsageDeck v$VERSION" \
              --notes "Download UsageDeck-Setup.exe and run it. Installed copies update themselves automatically.

          \`usagedeck-v${VERSION}-x64.exe\` is the standalone portable executable."
          fi
