name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (types, lint, unit, e2e, audit)
    # The app reads Windows-only credential stores and the snapshots are
    # rendered on Windows, so CI runs where the app runs.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Builds into .next-e2e and runs against Edge (preinstalled on the runner).
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  desktop:
    name: Desktop shell (syntax, audit)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # --ignore-scripts: no need to download the Electron binary to check it.
      - run: npm ci --ignore-scripts
      - run: node --check main.js && node --check preload.js && node --check settings-preload.js
      - run: npm audit --audit-level=high
