[package]
name = "usagedeck"
version = "1.1.0"
description = "UsageDeck: AI usage widget"
edition = "2021"
publish = false

[lib]
name = "usagedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["windows-native"] }
log = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
# Already in the lock file through tauri; decrypts the old app's enc:v1 keys on import.
sha2 = "0.10"

# Windows-only app: DPAPI for safeStorage keys, GDI for the theme sampler.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_HiDpi"] }
tauri-plugin-clipboard-manager = "2"
